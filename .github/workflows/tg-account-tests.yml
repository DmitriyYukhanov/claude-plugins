name: tg-account tests

on:
  push:
    branches: [main]
    paths:
      - 'plugins/tg-essentials/skills/tg-account/**'
      - '.github/workflows/tg-account-tests.yml'
  pull_request:
    paths:
      - 'plugins/tg-essentials/skills/tg-account/**'
      - '.github/workflows/tg-account-tests.yml'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Telegram dependencies
        run: python -m pip install opentele==1.15.1 telethon==1.45.0
      - name: Run offline regression tests
        run: python -m unittest discover -s plugins/tg-essentials/skills/tg-account/scripts -p "test_*.py"
